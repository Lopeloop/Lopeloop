  <text x="60" y="140" fill="#f0f4ee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="62" letter-spacing="-3">Lopeloop</text>
  <text x="64" y="185" fill="#b7c5ce" font-family="system-ui, -apple-system, sans-serif" font-size="22">Memory, experience, and what carries forward.</text>
  <text x="64" y="235" fill="#798e9a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">AGENT MEMORY / EXPERIMENTAL TOOLS / OPEN QUESTIONS</text>
