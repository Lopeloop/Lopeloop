<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
  <title id="title">Lopeloop</title>
  <desc id="desc">Independent research on memory for AI agents. A quiet dark banner with a looping line and connected points.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
